name: Build Debian 13 Qt6 AppImage (x86_64 & ARM64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-x86_64:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Package inside Debian 13 Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e ARCH=x86_64 \
            -e EXTRA_QT_PLUGINS=svg \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            debian:13 /bin/bash -c "
              set -e
              apt-get update && apt-get install -y \
                build-essential cmake file git curl \
                qt6-base-dev qt6-svg-dev libqt6svg6 &&
              cmake -B build -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build --target install DESTDIR=/workspace/AppDir &&
              curl -L -o /workspace/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage &&
              curl -L -o /workspace/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage &&
              chmod +x /workspace/linuxdeploy /workspace/linuxdeploy-plugin-qt &&
              export PATH=/workspace:\$PATH &&
              cd /workspace &&
              ./linuxdeploy --appdir AppDir/usr/local --plugin qt --output appimage &&
              chown -R $(id -u):$(id -g) AppDir build *.AppImage
            "

      - name: Upload Final x86_64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OrangeQPC-x86_64-AppImage
          path: "*.AppImage"

  build-arm64:
    name: Build AppImage (ARM64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3

      - name: Build and Package inside Debian 13 ARM64 Container
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            --platform linux/arm64 \
            -e ARCH=aarch64 \
            -e EXTRA_QT_PLUGINS=svg \
            -e APPIMAGE_EXTRACT_AND_RUN=1 \
            debian:13 /bin/bash -c "
              set -e
              apt-get update && apt-get install -y \
                build-essential cmake file git curl \
                qt6-base-dev qt6-svg-dev libqt6svg6 &&
              cmake -B build-arm -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build-arm --target install DESTDIR=/workspace/AppDir &&
              curl -L -o /workspace/linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage &&
              curl -L -o /workspace/linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage &&
              chmod +x /workspace/linuxdeploy /workspace/linuxdeploy-plugin-qt &&
              export PATH=/workspace:\$PATH &&
              cd /workspace &&
              ./linuxdeploy --appdir AppDir/usr/local --plugin qt --output appimage &&
              chown -R $(id -u):$(id -g) AppDir build-arm *.AppImage
            "

      - name: Upload Final ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OrangeQPC-ARM64-AppImage
          path: "*.AppImage"
