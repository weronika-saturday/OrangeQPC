name: Build Ubuntu Qt6 AppImage (x86_64 & ARM64)

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build-x86_64:
    name: Build AppImage (x86_64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake file git curl \
            qt6-base-dev qt6-svg-dev libqt6svg6

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target install DESTDIR=${{ github.workspace }}/AppDir

      - name: Download linuxdeploy Tools
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -L -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Package AppImage
        env:
          EXTRA_QT_PLUGINS: svg,platformthemes,styles
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export PATH="$PWD:$PATH"
          ARCH=x86_64 ./linuxdeploy \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Rename artifact
        run: |
          for f in OrangeQPC*.AppImage; do
            [ "$f" != "OrangeQPC-x86_64.AppImage" ] && mv "$f" OrangeQPC-x86_64.AppImage
          done

      - name: Upload Final x86_64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OrangeQPC-x86_64-AppImage
          path: "OrangeQPC-x86_64.AppImage"

  build-arm64:
    name: Build AppImage (ARM64)
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake file git curl \
            qt6-base-dev qt6-svg-dev libqt6svg6

      - name: Configure and Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --target install DESTDIR=${{ github.workspace }}/AppDir

      - name: Download linuxdeploy Tools
        run: |
          curl -L -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage
          curl -L -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-aarch64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

      - name: Package AppImage
        env:
          EXTRA_QT_PLUGINS: svg,platformthemes,styles
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          export PATH="$PWD:$PATH"
          ARCH=aarch64 ./linuxdeploy \
            --appdir AppDir \
            --plugin qt \
            --output appimage

      - name: Rename artifact
        run: |
          for f in OrangeQPC*.AppImage; do
            [ "$f" != "OrangeQPC-arm64.AppImage" ] && mv "$f" OrangeQPC-arm64.AppImage
          done

      - name: Upload Final ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: OrangeQPC-ARM64-AppImage
          path: "OrangeQPC-arm64.AppImage"

  release:
    name: Publish GitHub Release
    needs: [ build-x86_64, build-arm64 ]
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: OrangeQPC-x86_64-AppImage
          path: dist

      - name: Download ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: OrangeQPC-ARM64-AppImage
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OrangeQPC-x86_64.AppImage
            dist/OrangeQPC-arm64.AppImage
